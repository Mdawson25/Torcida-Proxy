<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torcida responsive review</title><style>body{font:15px/1.5 system-ui;background:#eae7e2;color:#29221c;margin:20px}h1{font-size:22px}button,select{font:inherit;padding:12px;margin:4px;border:1px solid #9b8c7c;border-radius:6px;background:#fffdf8;min-height:48px}#stage{overflow:auto;padding:16px 0}iframe{display:block;border:1px solid #8b7965;background:#f2ece2;width:390px;height:844px}pre{white-space:pre-wrap;background:#fffdf8;padding:16px;border-radius:8px;max-width:900px}label{margin:8px}</style></head><body><h1>Torcida responsive review</h1><div id="sizes"><button data-size="320,640">320 × 640</button><button data-size="360,800">360 × 800</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button data-size="768,1024">768 × 1024</button><button data-size="1024,768">1024 × 768</button><button data-size="932,430">932 × 430 landscape</button></div><label>Screen <select id="page"><option value="scanner">Find</option><option value="cigar">Humidor</option><option value="bar">Bar</option><option value="smoked">Journal</option><option value="guide" selected>Guide</option><option value="about">Settings</option></select></label><button id="audit">Audit current screen</button><p id="ready" role="status">Loading</p><pre id="report" aria-live="polite"></pre><div id="stage"><iframe id="app" title="Torcida app viewport" src="/#guide"></iframe></div><script>
const frame=document.getElementById('app');document.getElementById('sizes').onclick=e=>{if(!e.target.dataset.size)return;const [w,h]=e.target.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.getElementById('ready').textContent='Viewport '+w+' × '+h;};document.getElementById('page').onchange=e=>{frame.src='/#'+e.target.value;document.getElementById('ready').textContent='Loading screen';};frame.onload=()=>document.getElementById('ready').textContent='App loaded';
document.getElementById('audit').onclick=()=>{const doc=frame.contentDocument,win=frame.contentWindow,width=doc.documentElement.clientWidth;const visible=el=>{const r=el.getBoundingClientRect(),s=win.getComputedStyle(el);return r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0';};const overflow=Array.from(doc.body.querySelectorAll('*')).filter(el=>!el.closest('svg')&&visible(el)).filter(el=>{const r=el.getBoundingClientRect();return r.right>width+1||r.left< -1;}).slice(0,15).map(el=>({tag:el.tagName,id:el.id,class:el.className}));const targets=Array.from(doc.querySelectorAll('button,[role="button"]')).filter(visible).filter(el=>{const r=el.getBoundingClientRect();return r.width<47||r.height<47;}).map(el=>({label:el.getAttribute('aria-label')||el.textContent.trim(),width:Math.round(el.getBoundingClientRect().width),height:Math.round(el.getBoundingClientRect().height)}));document.getElementById('report').textContent=JSON.stringify({width,height:doc.documentElement.clientHeight,page:win.location.hash,documentWidth:doc.documentElement.scrollWidth,overflow,smallTargets:targets},null,2);};
</script></body></html>
